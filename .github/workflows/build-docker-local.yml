name: Build Spring Test Web & Local Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run backend tests
        run: mvn test -pl . -Dtest="**/util/JwtUtilTest,**/controller/AuthControllerTest"

      - name: Build Docker image
        run: docker build -t spring-test-web .

      - name: Stop old container
        run: |
          docker stop spring-test-web || true
          docker rm spring-test-web || true
          # Kill any other container occupying port 8080
          CONTAINER=$(docker ps -q --filter "publish=8080") && [ -n "$CONTAINER" ] && docker stop $CONTAINER && docker rm $CONTAINER || true

      - name: Start new container
        run: |
          docker run -d \
            --name spring-test-web \
            --restart always \
            -e DB_HOST=host.docker.internal \
            -e JWT_SECRET="${{ secrets.JWT_SECRET || 'default-secret-change-me-in-prod-32x' }}" \
            -e JWT_EXPIRATION_MS=3600000 \
            -p 8080:8080 \
            spring-test-web