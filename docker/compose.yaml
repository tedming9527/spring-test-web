services:
  redis:
    image: redis:7-alpine
    container_name: spring-test-web-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    container_name: spring-test-web-xxl-job-admin
    environment:
      PARAMS: >-
        --server.port=8080
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=
        --xxl.job.accessToken=
    ports:
      - "8081:8080"

volumes:
  redis-data:
