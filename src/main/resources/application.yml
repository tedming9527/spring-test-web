# CORS 跨域支持
web:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
spring:
  application:
    name: spring-test-web
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/springtestweb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      connection-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260515
    baseline-description: "Baseline after V20260515 has been applied"
mybatis-plus:
  mapper-locations: classpath*:org/example/**/mapper/*Mapper.xml
  type-aliases-package: org.example.springtestweb.**.vo, org.example.springtestweb.**.entiry,  org.example.springtestweb.**.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
  default-flat-param-object: true
  packages-to-scan: org.example.springtestweb
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: org.example.springtestweb
  model-and-view-allowed: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-secret-change-me-in-prod-32x}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
